spring.application.name=OpenRouter

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/charchat}
spring.datasource.username=${DATABASE_USERNAME:charchat}
spring.datasource.password=${DATABASE_PASSWORD:charchat}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.threads.virtual.enabled=true
app.openrouter.base-url=https://openrouter.ai/api/v1
app.openrouter.api-key=${OPENROUTER_API_KEY:}
app.openrouter.default-model=deepseek/deepseek-v4.1-flash-1017
app.openrouter.smoke-test=false
app.chat.smoke-test=true